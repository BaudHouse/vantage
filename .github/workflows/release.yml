name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test --if-present

      - name: Resolve version
        id: v
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

      # --publish never: electron-builder must not race the release API.
      # A single softprops step below is the only writer.
      - name: Build installer
        run: npm run build && npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ""

      # Only the NSIS installer ships. A recursive *.exe glob also catches
      # win-unpacked/Vantage.exe and NSIS's elevate.exe helper, which are not
      # deliverables — keep this non-recursive and installer-scoped.
      - name: Checksums
        shell: pwsh
        run: |
          Set-Location release
          $items = Get-ChildItem -Filter "*Setup*.exe" -File
          if (-not $items) { throw "no NSIS installer found in release/" }
          $items | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "installer count: $($items.Count)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Vantage ${{ steps.v.outputs.ver }}
          generate_release_notes: true
          files: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
